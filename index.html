<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculus Tool v4.2</title>
    <link rel="icon" type="image/x-icon" href="https://www.google.com/favicon.ico">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f4f4; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            overflow: hidden;
        }

        .hidden { display: none !important; }

        /* Calculator Styling */
        #calculator-ui {
            width: 320px;
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
        }

        #calc-display {
            width: 100%;
            height: 60px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 28px;
            text-align: right;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            color: #333;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .calc-grid button {
            padding: 20px;
            border: none;
            border-radius: 8px;
            background: #eee;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .calc-grid button:hover { background: #ddd; }
        .op-btn { background: #f0f0f0; color: #007bff; font-weight: bold; }
        .equal-btn { background: #007bff; color: white; grid-column: span 2; }
        .equal-btn:hover { background: #0056b3; }

        /* Portal Styling */
        #portal {
            text-align: center;
            background: #1a1a1a;
            width: 100vw;
            height: 100vh;
            color: #00ff00;
            padding-top: 50px;
        }

        .game-btn {
            background: #333;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 15px 30px;
            margin: 10px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            font-size: 18px;
        }

        #game-display { width: 100vw; height: 100vh; background: black; }
        iframe { width: 100%; height: calc(100% - 50px); border: none; }

        /* Panic Screen */
        #panic-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 10000; padding: 40px; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="calculator-ui">
        <input type="text" id="calc-display" readonly value="0">
        <div class="calc-grid">
            <button onclick="clearCalc()">C</button>
            <button onclick="appendOp('/')" class="op-btn">÷</button>
            <button onclick="appendOp('*')" class="op-btn">×</button>
            <button onclick="backspace()" class="op-btn">⌫</button>

            <button onclick="appendNum('7')">7</button>
            <button onclick="appendNum('8')">8</button>
            <button onclick="appendNum('9')">9</button>
            <button onclick="appendOp('-')" class="op-btn">-</button>

            <button onclick="appendNum('4')">4</button>
            <button onclick="appendNum('5')">5</button>
            <button onclick="appendNum('6')">6</button>
            <button onclick="appendOp('+')" class="op-btn">+</button>

            <button onclick="appendNum('1')">1</button>
            <button onclick="appendNum('2')">2</button>
            <button onclick="appendNum('3')">3</button>
            <button onclick="calculate()" class="equal-btn">=</button>

            <button onclick="appendNum('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendNum('.')">.</button>
        </div>
    </div>

    <div id="portal" class="hidden">
        <h1>SYSTEM TERMINAL v4.2</h1>
        <p>Unlocked: Admin Access</p>
        <hr style="width: 50%; border: 0.5px solid #333;">
        <button class="game-btn" onclick="loadGame('slope')">Play: Slope Plus</button>
        <button class="game-btn" onclick="loadGame('ovo')">Play: OvO</button>
        <button class="game-btn" onclick="location.reload()" style="color: red; border-color: red;">Lock Terminal</button>
    </div>

    <div id="game-display" class="hidden">
        <iframe id="game-frame" src=""></iframe>
        <div style="height: 50px; background: #222; display: flex; justify-content: center; align-items: center;">
            <button onclick="location.reload()" style="background:none; border: 1px solid #777; color: white; cursor:pointer;">Return to Calculator</button>
        </div>
    </div>

    <div id="panic-screen" class="hidden">
        <h1 style="color: black; font-family: sans-serif;">Calculus Review: Derivatives</h1>
        <hr>
        <p style="color: #444;">Section 4.2: Chain Rule Applications</p>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Linear_regression.svg/1200px-Linear_regression.svg.png" style="width: 400px;">
    </div>

    <script>
        let currentInput = "";
        const display = document.getElementById('calc-display');

        function appendNum(num) {
            if (currentInput === "0") currentInput = "";
            currentInput += num;
            display.value = currentInput;
        }

        function appendOp(op) {
            currentInput += op;
            display.value = currentInput;
        }

        function clearCalc() {
            currentInput = "";
            display.value = "0";
        }

        function backspace() {
            currentInput = currentInput.slice(0, -1);
            display.value = currentInput || "0";
        }

        function calculate() {
            // THE SECRET TRIGGER
            if (currentInput === "69+420") {
                document.getElementById('calculator-ui').classList.add('hidden');
                document.getElementById('portal').classList.remove('hidden');
                document.body.style.backgroundColor = "#1a1a1a";
                return;
            }

            try {
                const result = eval(currentInput);
                display.value = result;
                currentInput = result.toString();
            } catch (e) {
                display.value = "Error";
                currentInput = "";
            }
        }

        function loadGame(game) {
            const frame = document.getElementById('game-frame');
            if (game === 'slope') frame.src = "https://slopenexus.github.io/games/v1.2.5/index.html";
            if (game === 'ovo') frame.src = "https://arjun99ab.github.io/ovo/1.4/";

            document.getElementById('portal').classList.add('hidden');
            document.getElementById('game-display').classList.remove('hidden');
        }

        // PANIC KEY: Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") {
                document.getElementById('calculator-ui').classList.add('hidden');
                document.getElementById('portal').classList.add('hidden');
                document.getElementById('game-display').classList.add('hidden');
                document.getElementById('panic-screen').classList.remove('hidden');
                document.body.style.backgroundColor = "white";
                document.title = "Math Workbook PDF";
            }
        });
    </script>
</body>
</html>
