<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="icon" type="image/x-icon" href="https://www.google.com/favicon.ico">
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #1a1a1a; 
            color: #00ff00; 
            text-align: center; 
            margin: 0;
            overflow: hidden; 
        }
        .hidden { display: none !important; }
        
        #math-header { padding: 20px; }
        
        .game-btn { 
            background: #333; 
            color: #00ff00; 
            border: 1px solid #00ff00; 
            padding: 12px 24px; 
            margin: 10px; 
            cursor: pointer; 
            font-size: 18px;
            transition: 0.3s;
        }
        .game-btn:hover { 
            background: #00ff00; 
            color: #000; 
        }
        
        #game-display {
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        iframe { 
            border: none; 
            width: 100%; 
            height: calc(100% - 60px); 
        }

        #panic-screen {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: white; 
            color: black; 
            z-index: 9999;
            display: flex; 
            align-items: center; 
            justify-content: center;
            flex-direction: column;
        }
        #panic-screen img { max-width: 70%; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <div id="panic-screen" class="hidden">
        <h1 style="font-family: sans-serif; margin-bottom: 20px;">Advanced Calculus Review - Unit 4: Linear Regression</h1>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Linear_regression.svg/1200px-Linear_regression.svg.png" alt="Math Data">
        <p style="font-family: sans-serif; color: #666; margin-top: 20px;">Reference Figure 4.2: Correlation Coefficients</p>
    </div>

    <div id="main-content">
        <div id="math-header">
            <h1>Math-Assets</h1>
            <p>Welcome (PS Don't Snitch)<span style="color: #00ff00;">Operational</span></p>
            <hr style="border: 0.5px solid #333; width: 80%;">
        </div>

        <div id="portal">
            <button class="game-btn" onclick="loadGame('slope')">Play: Slope Plus</button>
            <button class="game-btn" onclick="loadGame('ovo')">Play: OvO</button>
            <button class="game-btn" onclick="loadGame('proxy')">Use: Web Proxy</button>
        </div>

        <div id="game-display" class="hidden">
            <iframe id="game-frame" src="" allowfullscreen></iframe>
            <div style="height: 60px; background: #222; display: flex; align-items: center; justify-content: center;">
                <button class="game-btn" style="font-size: 14px; padding: 5px 15px;" onclick="location.reload()">Terminate Process</button>
            </div>
        </div>
    </div>

    <script>
        function loadGame(game) {
            const frame = document.getElementById('game-frame');
            const portal = document.getElementById('portal');
            const display = document.getElementById('game-display');
            const header = document.getElementById('math-header');

            // Scrambled links
            const links = {
                'slope': 'aHR0cHM6Ly9zbG9wZW5leHVzLmdpdGh1Yi5pby9nYW1lcy92MS4yLjUvaW5kZXguaHRtbA==',
                'ovo': 'aHR0cHM6Ly9hcmp1bjk5YWIuZ2l0aHViLmlvL292by8xLjQv',
                'proxy': 'aHR0cHM6Ly9hbmRyZXdkYXZpZHNvbnBob3RvZ3JhcGh5LmNvbS8='
            };

            if (links[game]) {
                frame.src = atob(links[game]); 
            }

            portal.classList.add('hidden');
            header.classList.add('hidden');
            display.classList.remove('hidden');
            window.focus();
        }

        
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                document.getElementById('main-content').classList.add('hidden');
                document.getElementById('panic-screen').classList.remove('hidden');
                document.title = "Math Workbook PDF"; 
            }
        });
    </script>
</body>
</html>
